name: SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Generate CycloneDX SBOM
        run: pnpm run sbom -- "$RUNNER_TEMP/carmediahub-sdk.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: carmediahub-sdk-sbom
          path: ${{ runner.temp }}/carmediahub-sdk.cdx.json
